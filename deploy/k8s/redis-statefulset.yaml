apiVersion: v1
kind: Service
metadata:
  name: molt-queue
  labels:
    app.kubernetes.io/name: molt-queue
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: molt-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: molt-queue-client
  labels:
    app.kubernetes.io/name: molt-queue
spec:
  selector:
    app.kubernetes.io/name: molt-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: molt-queue
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: molt-queue
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: molt-queue
  labels:
    app.kubernetes.io/name: molt-queue
spec:
  serviceName: molt-queue
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: molt-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: molt-queue
        app.kubernetes.io/component: durable-queue
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              cp /etc/redis-template/redis.conf /tmp/redis.conf
              printf '\nrequirepass %s\n' "$REDIS_PASSWORD" >> /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: molt-admission-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis-template
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: molt-queue-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Replace with the cluster's durable StorageClass.
        storageClassName: REPLACE_WITH_STORAGE_CLASS
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: molt-queue-config
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    maxmemory-policy noeviction
    tcp-keepalive 60
    timeout 0
