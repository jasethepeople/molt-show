apiVersion: v1
kind: Namespace
metadata:
  name: molt-show
  labels:
    app.kubernetes.io/part-of: molt-show
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: molt-show-compute-quota
spec:
  hard:
    requests.cpu: "8"
    limits.cpu: "12"
    requests.memory: 16Gi
    limits.memory: 24Gi
    persistentvolumeclaims: "4"
---
apiVersion: policy/v1
kind: LimitRange
metadata:
  name: molt-show-default-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "250m"
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
