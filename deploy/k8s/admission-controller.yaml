apiVersion: v1
kind: Service
metadata:
  name: molt-admission-controller
  labels:
    app.kubernetes.io/name: molt-admission-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: molt-admission-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: molt-admission-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: molt-admission-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: molt-admission-controller
  labels:
    app.kubernetes.io/name: molt-admission-controller
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: molt-admission-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: molt-admission-controller
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: molt-admission-controller
      terminationGracePeriodSeconds: 60
      containers:
        - name: admission-controller
          # Replace with the immutable image published by CI.
          image: ghcr.io/jasethepeople/molt-admission-controller:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/molt/policy.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_URL
              value: redis://molt-queue-client:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: molt-admission-secrets
                  key: REDIS_PASSWORD
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: molt-admission-secrets
                  key: INTERNAL_API_TOKEN
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/molt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: molt-admission-policy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: molt-admission-controller
  labels:
    app.kubernetes.io/name: molt-admission-controller
